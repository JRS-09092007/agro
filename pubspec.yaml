name: krishi_mitra
description: "KrishiMitra AI - Farmer Assistant App for Indian Agriculture"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.0
  shared_preferences: ^2.2.0
  geolocator: ^9.0.2
  intl: ^0.19.0
  google_maps_flutter: ^2.5.0
  image_picker: ^1.0.4
  permission_handler: ^11.4.3
  fl_chart: ^0.65.0
  awesome_notifications: ^0.8.1
  connectivity_plus: ^5.0.0
  dio: ^5.3.0
  google_generative_ai: ^0.4.0
  speech_to_text: ^6.1.0
  flutter_tts: ^0.6.1
  google_cloud_speech: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
